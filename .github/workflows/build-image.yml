# Build the host-portable Docker image on every push to main and publish to
# GHCR. This is the Vercel escape hatch: the same image runs on a VPS,
# Railway, Render, or Fly. Public repo → unlimited free Actions minutes, so
# the daily content-engine builds cost nothing here.
#
# Deploy job is gated on the DEPLOY_ENABLED repo variable (default "false")
# so images build and accumulate before any server exists. Flip it to "true"
# and add the SSH secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) once the
# VPS is provisioned — see docs/MIGRATION.md.

name: Build & deploy image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hardcoded lowercase: registries reject the mixed-case github.repository.
  IMAGE: ghcr.io/axiomdigitalhub/tone-recipes

jobs:
  # Unit tests gate the image build. `next build` (inside the Docker build)
  # already fails on type/lint errors; this catches the logic classes it
  # can't — quota math, token verification, rate-limit trust order, and the
  # stranded-workflow check that would have caught the email-sequence cron
  # sitting in docs/ for weeks.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            AMAZON_ASSOCIATES_TAG=${{ vars.AMAZON_ASSOCIATES_TAG }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/faderandknob
            docker compose pull app
            docker compose up -d app
            docker image prune -f

            # IndexNow (Bing/Yandex/Naver/Seznam — Google doesn't participate):
            # submit URLs whose sitemap <lastmod> changed in the last 48h.
            # Runs HERE (not on the GH runner) because Cloudflare 403s
            # unverified datacenter clients — the runner can't read our own
            # sitemap through the edge, but the app container serves it on
            # localhost. Best-effort: never fails the deploy. Kill switch:
            # `touch /opt/faderandknob/.indexnow-disabled` on the VPS
            # (repo vars aren't visible inside this SSH script).
            if [ ! -f .indexnow-disabled ]; then
              sleep 20
              docker compose exec -T app node --input-type=module -e '
                const res = await fetch("http://localhost:3000/sitemap.xml");
                if (!res.ok) { console.log("indexnow: sitemap fetch", res.status); process.exit(0); }
                const xml = await res.text();
                const entries = [...xml.matchAll(/<url>\s*<loc>([^<]+)<\/loc>(?:\s*<lastmod>([^<]+)<\/lastmod>)?/g)]
                  .map((m) => ({ loc: m[1].trim(), lastmod: m[2] }));
                const cutoff = Date.now() - 48 * 3600_000;
                const urls = entries.filter((e) => e.lastmod && new Date(e.lastmod).getTime() >= cutoff).map((e) => e.loc);
                if (urls.length === 0) { console.log("indexnow: nothing in 48h window"); process.exit(0); }
                const key = "605edcb76678f4c3701342d58a18d405";
                const r = await fetch("https://api.indexnow.org/indexnow", {
                  method: "POST",
                  headers: { "Content-Type": "application/json; charset=utf-8" },
                  body: JSON.stringify({ host: "faderandknob.com", key, keyLocation: "https://faderandknob.com/" + key + ".txt", urlList: urls.slice(0, 10000) }),
                });
                console.log("indexnow:", r.status, "for", urls.length, "URLs");
              ' || echo "indexnow ping failed (non-fatal)"
            fi

  # WebSub: tell the hubs the feeds changed so subscribers (Feedly,
  # NewsBlur, Flipboard, Inoreader) pull immediately instead of on their
  # polling schedule. Outbound-only POSTs — safe from the runner (the hubs
  # then fetch our feeds themselves). Gated by INDEXNOW_ENABLED (shared
  # syndication kill switch). Best-effort: never marks the deploy red.
  websub:
    needs: deploy
    if: vars.INDEXNOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping WebSub hubs
        run: |
          sleep 30
          for hub in "https://pubsubhubbub.appspot.com/" "https://websub.superfeedr.com/"; do
            for feed in "https://faderandknob.com/feed.xml" "https://faderandknob.com/feed.json"; do
              curl -s -o /dev/null -w "$hub <- $feed : %{http_code}\n" \
                -d "hub.mode=publish" --data-urlencode "hub.url=$feed" "$hub" || true
            done
          done
