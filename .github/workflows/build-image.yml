# Build the host-portable Docker image on every push to main and publish to
# GHCR. This is the Vercel escape hatch: the same image runs on a VPS,
# Railway, Render, or Fly. Public repo → unlimited free Actions minutes, so
# the daily content-engine builds cost nothing here.
#
# Deploy job is gated on the DEPLOY_ENABLED repo variable (default "false")
# so images build and accumulate before any server exists. Flip it to "true"
# and add the SSH secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) once the
# VPS is provisioned — see docs/MIGRATION.md.

name: Build & deploy image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hardcoded lowercase: registries reject the mixed-case github.repository.
  IMAGE: ghcr.io/axiomdigitalhub/tone-recipes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            AMAZON_ASSOCIATES_TAG=${{ vars.AMAZON_ASSOCIATES_TAG }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/faderandknob
            docker compose pull app
            docker compose up -d app
            docker image prune -f

  # Ping IndexNow (Bing/Yandex/Naver/Seznam — Google doesn't participate)
  # with URLs whose sitemap <lastmod> changed in the last 48h. Bing's index
  # is the retrieval backbone for ChatGPT search + Copilot, and measured
  # citation rates skew hard toward fresh content, so minutes-not-weeks
  # Bing pickup is the point (AI_SEARCH_PLAYBOOK §10). The script waits on
  # deploy so the new sitemap is what gets read. Gated by INDEXNOW_ENABLED
  # (same kill-switch pattern as DEPLOY_ENABLED/CRON_ENABLED). Best-effort:
  # a failed ping must not mark the deploy red.
  indexnow:
    needs: deploy
    if: vars.INDEXNOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for edge to serve the new sitemap
        run: sleep 45
      - name: Submit changed URLs
        run: npx -y tsx scripts/indexnow-submit.ts --since-hours=48

      # WebSub: tell the hubs the feeds changed so subscribers (Feedly,
      # NewsBlur, Flipboard, Inoreader) pull immediately instead of on
      # their polling schedule. Standard protocol ping, content-free.
      - name: Ping WebSub hubs
        run: |
          for hub in "https://pubsubhubbub.appspot.com/" "https://websub.superfeedr.com/"; do
            for feed in "https://faderandknob.com/feed.xml" "https://faderandknob.com/feed.json"; do
              curl -s -o /dev/null -w "$hub <- $feed : %{http_code}\n" \
                -d "hub.mode=publish" --data-urlencode "hub.url=$feed" "$hub" || true
            done
          done
