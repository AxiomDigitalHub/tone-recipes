# Host-portable replacement for the vercel.json cron: fires the Sunday
# Setlist newsletter endpoint every Tuesday 14:00 UTC with the CRON_SECRET
# bearer token (same auth Vercel Cron uses).
#
# Gated on the CRON_ENABLED repo variable (default "false") so it does NOT
# double-send while the Vercel cron is still active. Flip to "true" at
# cutover, at the same moment the vercel.json cron is retired — see
# docs/MIGRATION.md.

name: Sunday Setlist cron

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

jobs:
  send:
    if: vars.CRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter endpoint
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://faderandknob.com/api/cron/sunday-setlist")
          echo "HTTP $code"
          cat /tmp/body
          [ "$code" = "200" ] || exit 1
