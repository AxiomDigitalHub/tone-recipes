# Fires the Sunday Setlist newsletter endpoint every Tuesday 14:00 UTC
# with the CRON_SECRET bearer token. Live since cutover (CRON_ENABLED=true,
# 2026-07-08).
#
# The CRON_ENABLED gate existed to prevent double-sends while the old
# Vercel cron was still active; it stays as a kill switch. NOTE: until the
# Vercel project is paused/deleted, its cron ALSO fires Tue 14:00 UTC and
# will double-send — see docs/VERCEL_DECOMMISSION_SPRINT.md item 2.

name: Sunday Setlist cron

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

jobs:
  send:
    if: vars.CRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter endpoint
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://faderandknob.com/api/cron/sunday-setlist")
          echo "HTTP $code"
          cat /tmp/body
          [ "$code" = "200" ] || exit 1
