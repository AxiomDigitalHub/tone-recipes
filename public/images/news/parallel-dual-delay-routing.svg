<svg viewBox="0 0 700 330" width="700" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pdd-title pdd-desc" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="pdd-title">Parallel dual delay routing on a Helix</title>
  <desc id="pdd-desc">Signal flow: guitar into amp, then cab, then the path splits. Path A runs a digital delay set to dotted eighths, path B runs a tape echo set to quarter notes. The two paths mix back together and go to the output.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0A0908"/>
    </marker>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="700" height="330" fill="#EDEAE4"/>
  <rect x="0.5" y="0.5" width="699" height="329" fill="none" stroke="rgba(10,9,8,0.12)"/>

  <!-- caption -->
  <text x="24" y="34" font-size="12" letter-spacing="2.5" fill="#5F5A52">TWO DELAYS AT ONCE &#8212; THE TIMELINE MX TRICK, IN HELIX BLOCKS</text>
  <line x1="24" y1="46" x2="676" y2="46" stroke="rgba(10,9,8,0.12)"/>

  <!-- input -->
  <circle cx="38" cy="185" r="6" fill="none" stroke="#0A0908" stroke-width="1.5"/>
  <text x="38" y="214" font-size="10.5" letter-spacing="1.5" fill="#5F5A52" text-anchor="middle">GUITAR</text>
  <line x1="44" y1="185" x2="66" y2="185" stroke="#0A0908" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- amp -->
  <rect x="72" y="161" width="76" height="48" fill="#F5F2EC" stroke="#0A0908" stroke-width="1.5"/>
  <text x="110" y="190" font-size="13" letter-spacing="1.5" fill="#0A0908" text-anchor="middle" font-weight="600">AMP</text>
  <line x1="148" y1="185" x2="170" y2="185" stroke="#0A0908" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cab -->
  <rect x="176" y="161" width="76" height="48" fill="#F5F2EC" stroke="#0A0908" stroke-width="1.5"/>
  <text x="214" y="190" font-size="13" letter-spacing="1.5" fill="#0A0908" text-anchor="middle" font-weight="600">CAB</text>
  <line x1="252" y1="185" x2="282" y2="185" stroke="#0A0908" stroke-width="1.5"/>

  <!-- split node -->
  <circle cx="288" cy="185" r="5" fill="#0A0908"/>

  <!-- branch to path A (top) -->
  <polyline points="288,180 288,110 328,110" fill="none" stroke="#0A0908" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <!-- branch to path B (bottom) -->
  <polyline points="288,190 288,260 328,260" fill="none" stroke="#0A0908" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="264" y="203" width="48" height="14" fill="#EDEAE4"/>
  <text x="288" y="214" font-size="10.5" letter-spacing="1.5" fill="#5F5A52" text-anchor="middle">SPLIT</text>

  <!-- path A: digital delay -->
  <rect x="334" y="82" width="196" height="56" fill="#F5F2EC" stroke="#B37A1D" stroke-width="1.5"/>
  <rect x="334" y="82" width="5" height="56" fill="#E4A235"/>
  <text x="350" y="106" font-size="13" letter-spacing="1.2" fill="#0A0908" font-weight="600">DIGITAL DELAY</text>
  <text x="350" y="126" font-size="11" fill="#5F5A52">dotted eighth &#183; the U2 bounce</text>
  <text x="530" y="74" font-size="10.5" letter-spacing="2" fill="#B37A1D" text-anchor="end">PATH A</text>

  <!-- path B: tape echo -->
  <rect x="334" y="232" width="196" height="56" fill="#F5F2EC" stroke="#B37A1D" stroke-width="1.5"/>
  <rect x="334" y="232" width="5" height="56" fill="#E4A235"/>
  <text x="350" y="256" font-size="13" letter-spacing="1.2" fill="#0A0908" font-weight="600">TAPE ECHO</text>
  <text x="350" y="276" font-size="11" fill="#5F5A52">quarter note &#183; warm and wobbly</text>
  <text x="530" y="306" font-size="10.5" letter-spacing="2" fill="#B37A1D" text-anchor="end">PATH B</text>

  <!-- merge from A -->
  <polyline points="530,110 574,110 574,180" fill="none" stroke="#0A0908" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- merge from B -->
  <polyline points="530,260 574,260 574,190" fill="none" stroke="#0A0908" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- merge node -->
  <circle cx="574" cy="185" r="5" fill="#0A0908"/>
  <rect x="556" y="203" width="36" height="14" fill="#EDEAE4"/>
  <text x="574" y="214" font-size="10.5" letter-spacing="1.5" fill="#5F5A52" text-anchor="middle">MIX</text>

  <!-- output -->
  <line x1="579" y1="185" x2="640" y2="185" stroke="#0A0908" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="652" cy="185" r="6" fill="none" stroke="#0A0908" stroke-width="1.5"/>
  <text x="652" y="214" font-size="10.5" letter-spacing="1.5" fill="#5F5A52" text-anchor="middle">OUT</text>
</svg>
